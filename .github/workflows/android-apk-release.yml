name: Android APK release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS
        env:
          BUILD_MESSAGE: GitHub Actions run ${{ github.run_number }} on ${{ github.ref_name }}
        run: >-
          eas build
          --platform android
          --profile preview
          --non-interactive
          --wait
          --message "$BUILD_MESSAGE"

      - name: Find and download the completed APK
        id: artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          eas build:list \
            --platform android \
            --status finished \
            --build-profile preview \
            --git-commit-hash "$COMMIT_SHA" \
            --limit 10 \
            --json > eas-builds.json

          build_id="$(node -e 'const fs=require("fs");const builds=JSON.parse(fs.readFileSync("eas-builds.json","utf8"));const build=builds.find((item)=>item.gitCommitHash===process.env.COMMIT_SHA);if(!build){throw new Error("No finished EAS preview build was found for this commit.");}process.stdout.write(build.id);')"
          eas build:download --build-id "$build_id" --non-interactive --json > eas-artifact.json

          artifact_path="$(node -e 'const fs=require("fs");const result=JSON.parse(fs.readFileSync("eas-artifact.json","utf8"));if(!result.path){throw new Error("EAS did not return an APK artifact path.");}process.stdout.write(result.path);')"
          test -s "$artifact_path"
          apk_name="deplo-android-${COMMIT_SHA:0:7}.apk"
          cp "$artifact_path" "$apk_name"
          echo "apk=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: release
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          branch_slug="${BRANCH_NAME//\//-}"
          short_sha="${COMMIT_SHA:0:7}"
          echo "tag=android-${branch_slug}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=Android APK · ${BRANCH_NAME} · ${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.apk }}
