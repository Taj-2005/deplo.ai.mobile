name: Android APK release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project and build release APK
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p="app.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew --no-daemon assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "deplo-android-${GITHUB_SHA::7}.apk"
          test -s "deplo-android-${GITHUB_SHA::7}.apk"

      - name: Prepare release metadata
        id: release
        run: |
          branch_slug="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          echo "tag=android-${branch_slug}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=Android APK · ${GITHUB_REF_NAME} · ${short_sha}" >> "$GITHUB_OUTPUT"
          echo "apk=deplo-android-${short_sha}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          files: ${{ steps.release.outputs.apk }}
